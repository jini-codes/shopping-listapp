<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a8f98;
    --accent: #4f7cff;
    --accent-light: #eaf0ff;
    --danger: #e5484d;
    --border: #e4e6ea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 440px;
  }

  h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }

  .subtitle {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 20px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    background: var(--card);
    outline: none;
  }

  .input-row input:focus {
    border-color: var(--accent);
  }

  .input-row button {
    padding: 0 18px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  .input-row button:hover {
    background: #3d66e0;
  }

  .stats {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
  }

  .stats button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
    padding: 0;
  }

  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }

  li .check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, border-color .15s;
  }

  li.checked .check {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-size: 13px;
  }

  li .text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }

  li.checked .text {
    color: var(--muted);
    text-decoration: line-through;
  }

  li .delete {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    line-height: 1;
  }

  li .delete:hover {
    color: var(--danger);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>
    <p class="subtitle">항목을 추가하고, 체크하고, 삭제해보세요.</p>

    <div class="input-row">
      <input id="itemInput" type="text" placeholder="살 물건을 입력하세요" autofocus>
      <button id="addBtn">추가</button>
    </div>

    <div class="stats">
      <span id="statsText">0개 항목</span>
      <button id="clearCheckedBtn">체크된 항목 삭제</button>
    </div>

    <ul id="list"></ul>
    <div class="empty" id="emptyMsg">리스트가 비어 있어요.</div>
  </div>

  <script>
    const STORAGE_KEY = 'shopping-list-items';

    const listEl = document.getElementById('list');
    const inputEl = document.getElementById('itemInput');
    const addBtn = document.getElementById('addBtn');
    const statsText = document.getElementById('statsText');
    const emptyMsg = document.getElementById('emptyMsg');
    const clearCheckedBtn = document.getElementById('clearCheckedBtn');

    let items = loadItems();

    function loadItems() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    function saveItems() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      } catch (e) {
        // ignore storage errors (e.g. private mode)
      }
    }

    function addItem(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      items.push({ id: Date.now() + Math.random(), text: trimmed, checked: false });
      saveItems();
      render();
    }

    function toggleItem(id) {
      const item = items.find(i => i.id === id);
      if (item) item.checked = !item.checked;
      saveItems();
      render();
    }

    function deleteItem(id) {
      items = items.filter(i => i.id !== id);
      saveItems();
      render();
    }

    function clearChecked() {
      items = items.filter(i => !i.checked);
      saveItems();
      render();
    }

    function render() {
      listEl.innerHTML = '';
      emptyMsg.style.display = items.length === 0 ? 'block' : 'none';

      items.forEach(item => {
        const li = document.createElement('li');
        li.className = item.checked ? 'checked' : '';

        const check = document.createElement('div');
        check.className = 'check';
        check.textContent = item.checked ? '✓' : '';
        check.addEventListener('click', () => toggleItem(item.id));

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = item.text;
        text.addEventListener('click', () => toggleItem(item.id));

        const del = document.createElement('button');
        del.className = 'delete';
        del.textContent = '✕';
        del.addEventListener('click', () => deleteItem(item.id));

        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(del);
        listEl.appendChild(li);
      });

      const total = items.length;
      const checkedCount = items.filter(i => i.checked).length;
      statsText.textContent = total === 0 ? '0개 항목' : `${total}개 항목 중 ${checkedCount}개 완료`;
    }

    addBtn.addEventListener('click', () => {
      addItem(inputEl.value);
      inputEl.value = '';
      inputEl.focus();
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        addItem(inputEl.value);
        inputEl.value = '';
      }
    });

    clearCheckedBtn.addEventListener('click', clearChecked);

    render();
  </script>
</body>
</html>
